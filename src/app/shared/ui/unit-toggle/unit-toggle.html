<div class="unit-toggle" role="group">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="unit-toggle__btn"
      [class.unit-toggle__btn--active]="option.value === value"
      [disabled]="disabled"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
